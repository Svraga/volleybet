name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/volleybet
      DIRECT_URL: postgresql://localhost:5432/volleybet
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-session-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --omit=dev
